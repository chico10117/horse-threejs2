# Validates every PR and push to main; deploys main to GitHub Pages.
# The site is static (no build step), so "build" means assembling _site/
# from the files the page actually serves.
name: CI / Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; runs on main always finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  ESLINT_VERSION: "8.57.1"
  PLAYWRIGHT_VERSION: "1.49.1"

jobs:
  validate:
    name: Lint, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax check
        run: for f in src/*.js src/horse/*.js tests/*.mjs; do node --check "$f"; done

      - name: Lint (undefined names, import assignment)
        run: >
          npx --yes eslint@${{ env.ESLINT_VERSION }} --no-eslintrc
          --env browser,es2022
          --parser-options ecmaVersion:2022,sourceType:module
          --rule '{"no-undef":"error","no-import-assign":"error"}'
          src

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html styles.css src vendor _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install --with-deps chromium

      - name: Smoke test the assembled site
        run: |
          python3 -m http.server 8765 --directory _site >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ >/dev/null && break; sleep 0.5; done
          BASE_URL=http://localhost:8765/ node tests/smoke.mjs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      # One production deploy at a time; a newer pending run replaces an older pending one.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
